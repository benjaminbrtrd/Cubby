name: Release

# Push a tag like v2026.11.0 (or v2026.11.0-alpha.1) to build the Windows installer
# and attach it to a draft GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Interface dependencies
        working-directory: ui
        run: npm ci

      # v2026.11.0-alpha.1 becomes "Cubby 2026.11 alpha 1", with a notes template to fill in before publishing.
      - name: Release title and notes
        id: notes
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $m = [regex]::Match($version, '^(\d+\.\d+)\.(\d+)(?:-([a-z]+)\.?(\d+)?)?')
          $title = 'Cubby ' + $(if ($m.Groups[2].Value -eq '0') { $m.Groups[1].Value } else { "$($m.Groups[1].Value).$($m.Groups[2].Value)" })
          if ($m.Groups[3].Success) { $title += ' ' + $m.Groups[3].Value }
          if ($m.Groups[4].Success) { $title += ' ' + $m.Groups[4].Value }
          $body = (Get-Content .github/release-notes.md -Raw -Encoding utf8).Replace('{{TITLE}}', $title).Replace('{{VERSION}}', $version)
          "title=$title" >> $env:GITHUB_OUTPUT
          "body<<NOTES_END" >> $env:GITHUB_OUTPUT
          $body >> $env:GITHUB_OUTPUT
          "NOTES_END" >> $env:GITHUB_OUTPUT

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: without them, CurseForge search is off and only the demo can be played.
          CUBBY_CURSEFORGE_API_KEY: ${{ secrets.CUBBY_CURSEFORGE_API_KEY }}
          CUBBY_MSA_CLIENT_ID: ${{ vars.CUBBY_MSA_CLIENT_ID }}
        with:
          tauriScript: npm run tauri
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: ${{ steps.notes.outputs.title }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

name: Release

# Push a tag like v2026.11.0 (or v2026.11.0-alpha.1) to build Cubby for Windows, macOS (Apple Silicon
# and Intel) and Linux, and attach everything to a draft GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # The draft release first, so the three builds upload to the same one.
  draft:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create the draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # Named like the first release: "Cubby v2026.11.0-alpha.1".
          title="Cubby $TAG"
          # The notes of this version, written in .github/releases/<tag>.md, or an empty outline to fill in.
          body=".github/releases/$TAG.md"
          [ -f "$body" ] || body=.github/releases/_draft.md
          sed -e "/{{NOTES}}/{r $body" -e 'd}' .github/release-notes.md | sed -e "s/{{TITLE}}/$title/g" -e "s/{{VERSION}}/$version/g" > notes.md
          prerelease=""
          [[ "$version" == *-* ]] && prerelease="--prerelease"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft $prerelease --title "$title" --notes-file notes.md --verify-tag
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ''
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Interface dependencies
        working-directory: ui
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update archives for the in-app updater; the public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional: without them, CurseForge search is off and only the demo can be played.
          CUBBY_CURSEFORGE_API_KEY: ${{ secrets.CUBBY_CURSEFORGE_API_KEY }}
          CUBBY_MSA_CLIENT_ID: ${{ vars.CUBBY_MSA_CLIENT_ID }}
        with:
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          releaseId: ${{ needs.draft.outputs.id }}
          # The manifest job writes latest.json once every build is there (four jobs writing it at once lose entries).
          includeUpdaterJson: false

  # latest.json lists the update archive of every platform, for the in-app updater.
  manifest:
    needs: [draft, build]
    if: ${{ !cancelled() && needs.draft.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Write latest.json
        run: |
          mkdir sigs && cd sigs
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig'
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          platforms='{}'
          for sig in *.sig; do
            asset="${sig%.sig}"
            case "$asset" in
              *x64-setup.exe) key=windows-x86_64 ;;
              *aarch64.app.tar.gz) key=darwin-aarch64 ;;
              *x64.app.tar.gz) key=darwin-x86_64 ;;
              *amd64.AppImage) key=linux-x86_64 ;;
              *) continue ;;
            esac
            platforms=$(jq --arg k "$key" --arg s "$(cat "$sig")" --arg u "$base/$asset" '. + {($k): {signature: $s, url: $u}}' <<< "$platforms")
          done
          jq -n --arg v "${TAG#v}" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson p "$platforms" \
            '{version: $v, notes: "", pub_date: $d, platforms: $p}' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
